name: Work for autopilot
description: A change that autopilot can build on its own once it gets the `autopilot` label.
body:
  - type: markdown
    attributes:
      value: |
        Autopilot builds an issue only when it is clear, small and supported by the
        understanding (`.github/autopilot/admission.md`). What this form asks for is
        what it checks first; a missing answer is the most common reason an issue
        comes back as `autopilot:needs-design`. Decide it here, before the label.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Whose problem, and what goes wrong or is missing today.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected behaviour
      description: What is true when this is done, precise enough that two builders would build the same thing.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Checkable statements, one per line. For an endpoint, the route, method, request, response and status codes, the error cases included.
      placeholder: |
        - GET /api/files returns 200 with …
        - An unknown id returns 404
    validations:
      required: true
  - type: textarea
    id: understanding
    attributes:
      label: Understanding
      description: The projection sections or accepted logs in musichub-understanding that support this. If none does yet, record the decision there first.
      placeholder: features/features.md § Library; logs/2026-10-18-12-00-00-internal-file-upload-contract.md
    validations:
      required: true
  - type: textarea
    id: exposure
    attributes:
      label: Exposure and data
      description: Who can reach what this adds (there is no authentication yet), and whether data is deleted, overwritten or newly shown. "None" when it changes neither.
    validations:
      required: true
  - type: textarea
    id: packages
    attributes:
      label: Packages and components
      description: Any new NuGet or npm package (name, exact version, why), and the official shadcn/ui components it needs. A UI package beyond React, shadcn/ui and Tailwind needs the owner's explicit approval here. "None" when it needs none.
      placeholder: "npm: zod 3.25.76, to validate the upload form (approved: @vanBassum)"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What this deliberately doesn't do, so it stays one small change.
    validations:
      required: false
