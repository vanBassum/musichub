name: Work for autopilot
description: A change Claude can build once it gets the `autopilot` label.
body:
  - type: markdown
    attributes:
      value: |
        With the `autopilot` label, Claude builds this issue and opens a PR
        (`.github/autopilot.md`). It stops and asks when a decision is missing, so
        decide it here, before the label.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Whose problem, and what goes wrong or is missing today.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected behaviour
      description: What is true when this is done, precise enough that two builders would build the same thing.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Checkable statements, one per line. For an endpoint, the route, method, request, response and status codes, the error cases included.
      placeholder: |
        - GET /api/files returns 200 with …
        - An unknown id returns 404
    validations:
      required: true
  - type: textarea
    id: understanding
    attributes:
      label: Understanding
      description: The projection sections or accepted logs in musichub-understanding that support this. If none does yet, record the decision there first.
      placeholder: features/features.md § Library; logs/2026-10-18-12-00-00-internal-file-upload-contract.md
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What this deliberately doesn't do, so it stays one small change.
    validations:
      required: false
