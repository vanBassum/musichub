name: Autopilot fix

# The one fix round of an autopilot attempt (see autopilot.yml and "Autopilot" in
# CLAUDE.md). When the first review of an attempt's PR blocks it with findings a code
# change can address, the review's autopilot job (claude-review.yml, `autopilot.sh
# outcome`) moves the attempt to `fix` and dispatches this workflow for that PR and
# the commit the review blocked:
#
#   start -> fix -> publish
#
#   start    the attempt is still in `fix` for this PR at this commit, the label and
#            PIPELINE_MODE full still hold, the Actions budget and Claude's usage
#            status allow it; collects the reviewers' findings
#   fix      Claude fixes only those findings, on top of the reviewed commit
#   publish  the same checks as autopilot.yml's publish, over the whole PR; moves the
#            attempt back to `merge` and pushes the fix to the same PR branch
#
# The push starts the review again: all four reviewers and the build check on the
# new commit, then the ordinary merge gate. If that review blocks again, `outcome`
# stops the attempt: an attempt has at most one fix round, counted by its `fix`
# marker on the issue, which no rerun or later event can undo. While the attempt is
# in `fix`, the gate merges nothing.
#
# Anyone with write access can dispatch this by hand; that changes nothing unless the
# attempt is in its fix round for that PR (every job checks the state first). Any
# failure stops the attempt as autopilot.yml does: back to To Do, the PR labelled
# `no-automerge` and kept.
#
# Tokens as in autopilot.yml: Claude only runs in the read-only `fix` job; its
# commits travel to `publish` as a git bundle, and only `publish` holds
# AUTOPILOT_PAT to push (a push with GITHUB_TOKEN would start no review).

on:
  workflow_dispatch:
    inputs:
      pr:
        description: The autopilot PR whose blocking review findings get the fix round
        required: true
        type: string
      sha:
        description: The full SHA of the commit that review blocked
        required: true
        type: string

run-name: Autopilot fix for PR #${{ inputs.pr }}

permissions: {}

# One fix run per PR at a time; a second dispatch waits, then finds the round over.
concurrency:
  group: autopilot-fix-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  start:
    runs-on: [self-hosted, strato]
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ inputs.pr }}
      SHA: ${{ inputs.sha }}
      PIPELINE_MODE: ${{ vars.PIPELINE_MODE }}
      AUTOPILOT_ACTIONS_LIMIT_PCT: ${{ vars.AUTOPILOT_ACTIONS_LIMIT_PCT }}
      AUTOPILOT_ACTIONS_INCLUDED_MINUTES: ${{ vars.AUTOPILOT_ACTIONS_INCLUDED_MINUTES }}
      AUTOPILOT_ACTIONS_LAG_MINUTES: ${{ vars.AUTOPILOT_ACTIONS_LAG_MINUTES }}
      AUTOPILOT_ATTEMPT_RESERVE_MINUTES: ${{ vars.AUTOPILOT_ATTEMPT_RESERVE_MINUTES }}
      AUTOPILOT_CLAUDE_AUTH: ${{ secrets.AUTOPILOT_ANTHROPIC_API_KEY != '' && 'api-key' || 'subscription' }}
    outputs:
      go: ${{ steps.start.outputs.go }}
      issue: ${{ steps.start.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: precheck
        env:
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          AUTOPILOT_PROJECT_ID: ${{ vars.AUTOPILOT_PROJECT_ID }}
          AUTOPILOT_BOARD_TOKEN: ${{ secrets.AUTOPILOT_BOARD_TOKEN }}
          AUTOPILOT_BILLING_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          AUTOPILOT_DIR: ${{ runner.temp }}/autopilot
        run: bash .github/scripts/autopilot.sh fix-precheck

      # As in autopilot.yml: the runner's system Node is too old for Claude Code, and
      # one minimal call reads the subscription's usage status.
      - uses: actions/setup-node@v4
        if: steps.precheck.outputs.ok == 'true' && env.AUTOPILOT_CLAUDE_AUTH == 'subscription'
        with:
          node-version: '22'
      - name: Probe Claude's usage status
        if: steps.precheck.outputs.ok == 'true' && env.AUTOPILOT_CLAUDE_AUTH == 'subscription'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No GitHub token for Claude, and no tools: it can only answer.
          GH_TOKEN: ""
        run: |
          mkdir -p ${{ runner.temp }}/autopilot
          npm install --global --silent @anthropic-ai/claude-code@2.1.68 >/dev/null 2>&1 || true
          claude -p "Reply with OK." --model haiku --max-turns 1 --tools "" --strict-mcp-config --no-session-persistence --output-format stream-json --verbose \
            >"$RUNNER_TEMP/probe.jsonl" 2>/dev/null || true
          bash .github/scripts/claude-usage.sh "$RUNNER_TEMP/probe.jsonl" >${{ runner.temp }}/autopilot/claude-status.json \
            || rm -f ${{ runner.temp }}/autopilot/claude-status.json
          cat ${{ runner.temp }}/autopilot/claude-status.json 2>/dev/null || echo "The probe reported no usage status."

      - id: start
        if: steps.precheck.outputs.ok == 'true'
        env:
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          AUTOPILOT_PROJECT_ID: ${{ vars.AUTOPILOT_PROJECT_ID }}
          AUTOPILOT_BOARD_TOKEN: ${{ secrets.AUTOPILOT_BOARD_TOKEN }}
          AUTOPILOT_BILLING_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          CLAUDE_STATUS_FILE: ${{ runner.temp }}/autopilot/claude-status.json
          AUTOPILOT_DIR: ${{ runner.temp }}/autopilot
        run: bash .github/scripts/autopilot.sh fix-start
      - uses: actions/upload-artifact@v4
        if: steps.start.outputs.go == 'true'
        with:
          name: autopilot-fix-findings
          path: ${{ runner.temp }}/autopilot/findings.md
          retention-days: 14

  fix:
    needs: start
    if: needs.start.outputs.go == 'true'
    runs-on: [self-hosted, strato]
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # The PR at the commit the review blocked: that is what gets fixed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          fetch-depth: 50
      # The prompt and the usage script come from main, never from the PR.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          sparse-checkout: |
            .github/autopilot
            .github/scripts
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: autopilot-fix-findings
          path: ${{ runner.temp }}/autopilot
      - name: Prepare the workspace
        run: |
          # Kept outside the working tree, which Claude is about to change.
          cp trusted/.github/autopilot/fix.md ${{ runner.temp }}/autopilot/fix.md
          cp trusted/.github/scripts/claude-usage.sh ${{ runner.temp }}/claude-usage.sh
          rm -rf trusted
          git rev-parse HEAD >${{ runner.temp }}/autopilot/base
          git config user.name "musichub autopilot"
          git config user.email "autopilot@musichub.invalid"
          git switch -c autopilot-fix
          dotnet restore MusicHub.slnx
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
          pnpm --dir musichub-ui install --frozen-lockfile

      - name: Claude fix
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.AUTOPILOT_ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.AUTOPILOT_ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # `outcome` dispatches this workflow with the review run's GITHUB_TOKEN, so
          # the actor is github-actions[bot], and the action refuses bot-started runs
          # unless the bot is named here. That bot is no wider than a person with
          # write access: the default token is read-only, and the only job that holds
          # `actions: write` is claude-review.yml's shell job that runs `outcome`
          # (no Claude job may hold it; see .github/scripts/workflows.test.sh). And
          # `start` lets nothing through unless the attempt is in its fix round for
          # this PR at this commit, however the run was started.
          allowed_bots: github-actions
          # See autopilot.yml's analysis step: no shared inline-comment buffer.
          classify_inline_comments: "false"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: ${{ needs.start.outputs.issue }}
            PR: ${{ inputs.pr }}

            WORK_DIR: ${{ runner.temp }}/autopilot

            Read <WORK_DIR>/fix.md and follow it exactly.
          # The build step's permission policy (see autopilot.yml), plus reading the PR.
          claude_args: |
            --max-turns 100
            --add-dir ${{ runner.temp }}/autopilot
            --allowedTools "Read,Write,Edit,Grep,Glob,Bash(dotnet restore:*),Bash(dotnet build:*),Bash(pnpm --dir musichub-ui lint:*),Bash(pnpm --dir musichub-ui typecheck:*),Bash(pnpm --dir musichub-ui build:*),Bash(pnpm --dir musichub-ui format:*),Bash(git add:*),Bash(git commit:*),Bash(git mv:*),Bash(git rm:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*)"

      # Independent of what Claude reported: a clean tree and a clean build.
      - name: Validate and bundle the commits
        if: always()
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ -f "$EXEC" ]; then
            bash ${{ runner.temp }}/claude-usage.sh "$EXEC" >${{ runner.temp }}/autopilot/usage-fix.json || rm -f ${{ runner.temp }}/autopilot/usage-fix.json
          fi
          base=$(cat ${{ runner.temp }}/autopilot/base)
          if [ -n "$(git status --porcelain)" ]; then
            echo "fail: Claude left uncommitted changes" >${{ runner.temp }}/autopilot/validation
          elif ! dotnet build MusicHub.slnx --configuration Release; then
            echo "fail: dotnet build MusicHub.slnx --configuration Release failed" >${{ runner.temp }}/autopilot/validation
          elif ! pnpm --dir musichub-ui lint; then
            echo "fail: pnpm --dir musichub-ui lint failed" >${{ runner.temp }}/autopilot/validation
          elif ! pnpm --dir musichub-ui build; then
            echo "fail: pnpm --dir musichub-ui build (tsc -b and vite build) failed" >${{ runner.temp }}/autopilot/validation
          else
            echo pass >${{ runner.temp }}/autopilot/validation
          fi
          if [ "$(git rev-list --count "$base..HEAD")" -gt 0 ]; then
            git bundle create ${{ runner.temp }}/autopilot/autopilot.bundle "$base..HEAD"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopilot-fix-build
          path: |
            ${{ runner.temp }}/autopilot/result.md
            ${{ runner.temp }}/autopilot/base
            ${{ runner.temp }}/autopilot/validation
            ${{ runner.temp }}/autopilot/autopilot.bundle
            ${{ runner.temp }}/autopilot/usage-fix.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [start, fix]
    if: always() && needs.start.outputs.go == 'true'
    runs-on: [self-hosted, strato]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # main and every branch, the PR's included: the bundle builds on the PR's head.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: autopilot-fix-build
          path: ${{ runner.temp }}/autopilot
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          AUTOPILOT_PROJECT_ID: ${{ vars.AUTOPILOT_PROJECT_ID }}
          AUTOPILOT_BOARD_TOKEN: ${{ secrets.AUTOPILOT_BOARD_TOKEN }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          PIPELINE_MODE: ${{ vars.PIPELINE_MODE }}
          FIX_RESULT: ${{ needs.fix.result }}
          AUTOPILOT_DIR: ${{ runner.temp }}/autopilot
        run: bash .github/scripts/autopilot.sh fix-publish
