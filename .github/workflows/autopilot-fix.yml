name: Autopilot fix

# A fix round of an autopilot attempt (see autopilot.yml and "Autopilot" in
# CLAUDE.md). When a review of an attempt's PR blocks it with something a code
# change can address (blocking reviewer findings, a failed build check, a conflict
# with main), the review's autopilot job (claude-review.yml, `autopilot.sh outcome`)
# moves the attempt to `fix` and dispatches this workflow for that PR and the
# commit the review blocked:
#
#   start -> fix -> publish
#
#   start    the attempt is still in `fix` for this PR at this commit, the label and
#            PIPELINE_MODE full still hold, Claude's usage status allows it;
#            collects what is to be fixed (findings.md)
#   fix      in the sandbox: main merged into the PR, then Claude fixes what it can
#            fix without a decision, on top of the reviewed commit
#   publish  the same checks as autopilot.yml's publish, over the whole PR; moves the
#            attempt back to `merge`, records the finding keys Claude fixed, and
#            pushes the fix to the same PR branch
#
# The push starts the review again: all four reviewers and the build check on the
# new commit, then the ordinary merge gate. If that review blocks again, `outcome`
# grants the next round, up to three per attempt, unless a finding needs a decision
# or a finding this round reported fixed came back (see autopilot.sh, "FIX
# ROUNDS"). While the attempt is in `fix`, the gate merges nothing.
#
# Anyone with write access can dispatch this by hand; that changes nothing unless the
# attempt is in its fix round for that PR (every job checks the state first). A job
# that fails is rerun once by the watchdog (autopilot-watchdog.yml); when it fails
# again, the attempt stops as autopilot.yml's do: back to To Do, the PR labelled
# `no-automerge` and kept.
#
# Tokens as in autopilot.yml: Claude only runs in the sandbox of the read-only `fix`
# job; its commits travel to `publish` as a git bundle, and only `publish` holds
# AUTOPILOT_PAT to push (a push with GITHUB_TOKEN would start no review). The `fix`
# job checks out the PR's code but runs nothing of it on the runner: the scripts it
# runs come from main.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: The autopilot PR whose blocking review findings get the fix round
        required: true
        type: string
      sha:
        description: The full SHA of the commit that review blocked
        required: true
        type: string

# Quoted, as in claude-review.yml: the watchdog finds the PR by this name.
run-name: "Autopilot fix for PR #${{ inputs.pr }}"

permissions: {}

# One fix run per PR at a time; a second dispatch waits, then finds the round over.
concurrency:
  group: autopilot-fix-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  start:
    runs-on: [self-hosted, strato]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ inputs.pr }}
      SHA: ${{ inputs.sha }}
      PIPELINE_MODE: ${{ vars.PIPELINE_MODE }}
      AUTOPILOT_CLAUDE_AUTH: ${{ secrets.AUTOPILOT_ANTHROPIC_API_KEY != '' && 'api-key' || 'subscription' }}
    outputs:
      go: ${{ steps.start.outputs.go }}
      issue: ${{ steps.start.outputs.issue }}
      round: ${{ steps.start.outputs.round }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: precheck
        env:
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          AUTOPILOT_PROJECT_ID: ${{ vars.AUTOPILOT_PROJECT_ID }}
          AUTOPILOT_BOARD_TOKEN: ${{ secrets.AUTOPILOT_BOARD_TOKEN }}
          AUTOPILOT_DIR: ${{ runner.temp }}/autopilot
        run: bash .github/scripts/autopilot.sh fix-precheck

      # As in autopilot.yml: the runner's system Node is too old for Claude Code, and
      # one minimal call reads the subscription's usage status.
      - uses: actions/setup-node@v4
        if: steps.precheck.outputs.ok == 'true' && env.AUTOPILOT_CLAUDE_AUTH == 'subscription'
        with:
          node-version: '22'
      - name: Probe Claude's usage status
        if: steps.precheck.outputs.ok == 'true' && env.AUTOPILOT_CLAUDE_AUTH == 'subscription'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No GitHub token for Claude, and no tools: it can only answer.
          GH_TOKEN: ""
        run: |
          mkdir -p ${{ runner.temp }}/autopilot
          npm install --global --silent @anthropic-ai/claude-code@2.1.68 >/dev/null 2>&1 || true
          claude -p "Reply with OK." --model haiku --max-turns 1 --tools "" --strict-mcp-config --no-session-persistence --output-format stream-json --verbose \
            >"$RUNNER_TEMP/probe.jsonl" 2>/dev/null || true
          bash .github/scripts/claude-usage.sh "$RUNNER_TEMP/probe.jsonl" >${{ runner.temp }}/autopilot/claude-status.json \
            || rm -f ${{ runner.temp }}/autopilot/claude-status.json
          cat ${{ runner.temp }}/autopilot/claude-status.json 2>/dev/null || echo "The probe reported no usage status."

      - id: start
        if: steps.precheck.outputs.ok == 'true'
        env:
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          AUTOPILOT_PROJECT_ID: ${{ vars.AUTOPILOT_PROJECT_ID }}
          AUTOPILOT_BOARD_TOKEN: ${{ secrets.AUTOPILOT_BOARD_TOKEN }}
          CLAUDE_STATUS_FILE: ${{ runner.temp }}/autopilot/claude-status.json
          AUTOPILOT_DIR: ${{ runner.temp }}/autopilot
        run: bash .github/scripts/autopilot.sh fix-start
      - uses: actions/upload-artifact@v4
        if: steps.start.outputs.go == 'true'
        with:
          name: autopilot-fix-findings
          path: ${{ runner.temp }}/autopilot/findings.md
          retention-days: 14

  fix:
    needs: start
    if: needs.start.outputs.go == 'true'
    runs-on: [self-hosted, strato]
    timeout-minutes: 75
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # The PR at the commit the review blocked, with main: that is what gets fixed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      # The scripts and prompts come from main, never from the PR.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          sparse-checkout: |
            .github/autopilot
            .github/reviewers
            .github/scripts
            .github/sandbox
          persist-credentials: false
      - name: Check out the musichub understanding (read-only)
        uses: actions/checkout@v4
        with:
          repository: vanBassum/musichub-understanding
          ref: main
          path: understanding
          ssh-key: ${{ secrets.UNDERSTANDING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: autopilot-fix-findings
          path: ${{ runner.temp }}/findings

      # Everything the run reads, from trusted sources (see autopilot.yml's build).
      - name: Prepare the sandbox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ needs.start.outputs.issue }}
          PR: ${{ inputs.pr }}
        run: |
          T=trusted/.github
          bash $T/scripts/sandbox.sh prepare "$RUNNER_TEMP/sandbox" "$GITHUB_WORKSPACE"
          cp $T/scripts/sandbox-job.sh $T/scripts/claude-usage.sh $T/scripts/shadcn-components.sh \
             $T/scripts/add-package.sh $T/autopilot/fix.md $T/autopilot/admission.md "$RUNNER_TEMP/sandbox/trusted/"
          cp $T/reviewers/understanding.md "$RUNNER_TEMP/sandbox/trusted/reviewer-understanding.md"
          cp ${{ runner.temp }}/findings/findings.md "$RUNNER_TEMP/sandbox/in/findings.md"
          bash $T/scripts/thread-markdown.sh issue "${{ github.repository }}" "$ISSUE" >"$RUNNER_TEMP/sandbox/in/issue.md"
          bash $T/scripts/thread-markdown.sh pr "${{ github.repository }}" "$PR" >"$RUNNER_TEMP/sandbox/in/pr.md"
          gh pr diff "$PR" --repo "${{ github.repository }}" >"$RUNNER_TEMP/sandbox/in/pr.diff"
          bash $T/scripts/understanding-pending-logs.sh understanding understanding-pending-logs.md
          mv understanding-pending-logs.md "$RUNNER_TEMP/sandbox/in/"
          cp -r understanding "$RUNNER_TEMP/sandbox/in/understanding" && rm -rf "$RUNNER_TEMP/sandbox/in/understanding/.git"
          bash $T/scripts/issue-images.sh "${{ github.repository }}" "$ISSUE" "$RUNNER_TEMP/sandbox/in/images"

      - name: Claude fixes the findings, in the sandbox
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.AUTOPILOT_ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.AUTOPILOT_ANTHROPIC_API_KEY }}
          SANDBOX_REPO: ${{ github.repository }}
          SANDBOX_ISSUE: ${{ needs.start.outputs.issue }}
          SANDBOX_PR: ${{ inputs.pr }}
          SANDBOX_ROUND: ${{ needs.start.outputs.round }}
        run: bash trusted/.github/scripts/sandbox.sh run "$RUNNER_TEMP/sandbox" 65 bash /work/trusted/sandbox-job.sh fix

      # Only regular files, read as data: a link the run left could point anywhere
      # on the runner.
      - name: Keep the results
        if: always()
        run: |
          mkdir -p ${{ runner.temp }}/autopilot
          for f in result.md base validation autopilot.bundle usage-fix.json claude-exit; do
            if [ -f "$RUNNER_TEMP/sandbox/out/$f" ] && [ ! -L "$RUNNER_TEMP/sandbox/out/$f" ]; then cp "$RUNNER_TEMP/sandbox/out/$f" ${{ runner.temp }}/autopilot/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopilot-fix-build
          path: ${{ runner.temp }}/autopilot/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the sandbox
        if: always()
        run: bash trusted/.github/scripts/sandbox.sh clean "$RUNNER_TEMP/sandbox"

  publish:
    needs: [start, fix]
    if: always() && needs.start.outputs.go == 'true'
    runs-on: [self-hosted, strato]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # main and every branch, the PR's included: the bundle builds on the PR's head.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: autopilot-fix-build
          path: ${{ runner.temp }}/autopilot
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          AUTOPILOT_PROJECT_ID: ${{ vars.AUTOPILOT_PROJECT_ID }}
          AUTOPILOT_BOARD_TOKEN: ${{ secrets.AUTOPILOT_BOARD_TOKEN }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          PIPELINE_MODE: ${{ vars.PIPELINE_MODE }}
          FIX_RESULT: ${{ needs.fix.result }}
          AUTOPILOT_DIR: ${{ runner.temp }}/autopilot
        run: bash .github/scripts/autopilot.sh fix-publish
