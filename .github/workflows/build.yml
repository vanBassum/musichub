name: Build

# Every push to main publishes one immutable image, tagged with the commit it was
# built from: ghcr.io/vanbassum/musichub:sha-<12 hex>. An environment pins such a
# tag; deploying, promoting and rolling back are all "change that tag", never a
# rebuild. `main` is a moving alias for the newest build of main; nothing should pin
# it, except acceptance, which follows it on purpose (deploy-acceptance below). There
# are no release tags and no release branches.
#
# A pull request runs the same checks, but builds no image: the image is built only
# for main (job `image`), so a broken Dockerfile shows up on main, not on the PR.
# The check named `build` is the one to look at before merging: it only succeeds
# when `test` and `guard-tests` did.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/vanbassum/musichub

jobs:
  # The reviewers' verdict check (against a fake gh), the sandbox (against a stub
  # docker), the Claude action settings in the workflows, and the Claude guard in
  # .claude/hooks/. They run only scripts under .github/ and .claude/, which Bas
  # reviews by hand, so they run on the runner.
  guard-tests:
    runs-on: [self-hosted, strato]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The self-hosted runner's system node may be too old for guard.js.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash .github/scripts/review-verdict.test.sh
      - run: bash .github/scripts/workflows.test.sh
      - run: bash .github/scripts/sandbox.test.sh
      - run: node .claude/hooks/guard.test.js

  # The API and the UI: restored, built, tested and linted in the sandbox
  # (.github/scripts/sandbox.sh), a throwaway container. This is the PR's own code,
  # so it never runs on the runner, which holds the Docker socket.
  test:
    runs-on: [self-hosted, strato]
    # A hung restore or build must not hold the runner for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the sandbox
        run: |
          bash .github/scripts/sandbox.sh prepare "$RUNNER_TEMP/sandbox" "$GITHUB_WORKSPACE"
          cp .github/scripts/sandbox-job.sh "$RUNNER_TEMP/sandbox/trusted/"
      - name: Restore, build, test and lint, in the sandbox
        run: bash .github/scripts/sandbox.sh run "$RUNNER_TEMP/sandbox" 25 bash /work/trusted/sandbox-job.sh ci
      - name: Remove the sandbox
        if: always()
        run: bash .github/scripts/sandbox.sh clean "$RUNNER_TEMP/sandbox"
      # Add a pnpm test step to sandbox-job.sh when the UI gains its first automated tests.

  # The check the merge gate waits for: green only when both kinds of tests are.
  build:
    needs: [guard-tests, test]
    runs-on: [self-hosted, strato]
    timeout-minutes: 5
    steps:
      - run: echo "guard-tests and test passed."

  # The image, built and published only for main.
  image:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, strato]
    timeout-minutes: 30
    # A newer push to main supersedes a build still running.
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Supply the full commit SHA and actual UTC build time to the frontend build.
      # Keep the immutable image tag based on the existing 12-character SHA.
      - name: Compute build identity
        id: build_info
        run: |
          commit=$(git rev-parse HEAD)
          short_commit=$(git rev-parse --short=12 HEAD)
          echo "version=$(git log -1 --format=%cd --date=short)" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$short_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A sha tag is written once. Re-running the workflow for a commit that is
      # already published must not swap the image under a pin that an environment
      # may already be running.
      - name: Refuse to overwrite an existing sha tag
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.build_info.outputs.tag }}" >/dev/null 2>&1; then
            echo "$IMAGE:${{ steps.build_info.outputs.tag }} already exists; not rebuilding it."
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build and publish
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.build_info.outputs.tag }}
            ${{ env.IMAGE }}:main
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build_info.outputs.version }}
            APP_COMMIT=${{ steps.build_info.outputs.commit }}
            APP_BUILD_TIME=${{ steps.build_info.outputs.build_time }}

      - name: Summary
        run: |
          {
            echo "### $IMAGE:${{ steps.build_info.outputs.tag }}"
            echo
            echo "Deploy it by pinning \`$IMAGE:${{ steps.build_info.outputs.tag }}\` in the environment."
          } >> "$GITHUB_STEP_SUMMARY"

  # Every main build goes straight to acceptance: stacks/musichub-acc in
  # strato-stack (https://musichub-acc.vanbassum.com), which follows :main. The
  # script pulls this commit's sha tag onto the host with this job's token,
  # points the local :main at it and asks that stack's Watchtower (on the
  # internal deploy-network the strato runners join) to recreate the container,
  # then waits until it is healthy and reachable. Pinned environments are not
  # affected: they keep their sha tag.
  deploy-acceptance:
    name: Deploy to acceptance
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Must be our strato runner: it is on the host, and on its deploy-network.
    runs-on: [self-hosted, strato]
    timeout-minutes: 15
    concurrency:
      group: deploy-acceptance
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # The package is private and the acceptance Watchtower has no registry
      # credentials: the script pulls the image onto the host with this job's
      # short-lived token, and Watchtower (no-pull) recreates from it.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull, deploy and wait until healthy
        env:
          WATCHTOWER_TOKEN: ${{ secrets.ACCEPTANCE_DEPLOY_TOKEN }}
        run: bash .github/scripts/deploy-acceptance.sh "$IMAGE:sha-${GITHUB_SHA:0:12}" "$GITHUB_SHA"
