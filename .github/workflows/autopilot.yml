name: Autopilot
# Quoted, as in claude-review.yml: the watchdog finds the issue by this name.
run-name: "Autopilot #${{ github.event.issue.number || inputs.issue }}"

# One autonomous attempt at one issue, started by adding the `autopilot` label:
#
#   label added -> start -> build -> publish                      (this workflow)
#   PR reviewed  -> automerge -> autopilot outcome                (claude-review.yml)
#   review blocked -> start -> fix -> publish                     (autopilot-fix.yml)
#                  -> PR reviewed again -> automerge -> outcome    (up to 3 fix rounds)
#
#   board:  To Do -> Build -> Merge -> Done
#                     ^-- fix --'  (at most 3 rounds per attempt)
#           any stop or rejection -> To Do, label removed, with a comment saying why
#
# ONE STEP: the build job's single Claude run judges the issue against the
# understanding and the admission rules (.github/autopilot/admission.md) and, when it
# may be built, builds and tests it (.github/autopilot/build.md). When it may not, it
# says why, and publish puts that on the issue with an autopilot:<class> label. The
# run happens in the sandbox (.github/scripts/sandbox.sh): a throwaway container
# with no Docker socket, no runner files and no GitHub token. Its trusted steps put
# the issue, the open PRs, the understanding and the issue's images in it first.
#
# An issue that also carries `autopilot:analysis-only` is an investigation: the
# analysis job writes a report with the investigation prompt and `decide` posts it
# as a comment on the issue, nothing else: no issue is created, the issue stays
# open, `autopilot` is removed and `autopilot:analysis-only` stays: To Do ->
# Analysis -> To Do. Follow-up work is only suggested in the report; a human decides
# which of it becomes an issue. build and publish never run for it.
#
# The label is the only trigger a person uses; moving a card on the board starts
# nothing. The board follows the attempt; the state itself is the newest autopilot
# marker comment on the issue, kept by .github/scripts/autopilot.sh, which every step
# and the merge gate check. workflow_dispatch is how the queue
# (autopilot-queue.yml) starts an issue that waited for Claude's usage again; it
# starts nothing for an issue that isn't waiting.
#
# A job that fails (a crash, a timeout) is rerun once by the watchdog
# (autopilot-watchdog.yml); when it fails again, the attempt stops. Adding the label
# again resumes a stopped attempt whose PR is still open, and otherwise starts a new
# attempt, which supersedes any earlier one.
#
# PIPELINE_MODE (repository variable): off (default; the label is removed and
# nothing runs), analysis-only (Claude judges the issue and says whether it would
# build it; nothing is built) or full. Switching away from full stops a running
# attempt at its next step, and the merge gate then refuses its PR. An
# investigation builds nothing, so it runs the same in analysis-only and full.
#
# The budget, the only limit on how much autopilot takes on (see autopilot.sh). Every
# job runs on the self-hosted runner, which uses no GitHub Actions minutes, so there
# is no Actions budget.
# - Claude: a one-line probe with Claude Code reads the subscription's usage status
#   (its rate_limit_event). Autopilot starts only while it is `allowed`; otherwise
#   the issue keeps its label and waits for the queue. Claude doesn't report a
#   percentage below its own warning thresholds, so this is not an exact line.
# Each Claude run is also capped by --max-turns and a timeout, against runaways.
#
# Tokens: Claude never runs in a job that holds a write token. Comments, labels and
# state markers are written by plain shell jobs with the workflow's GITHUB_TOKEN.
# AUTOPILOT_PAT, a fine-grained token of the repository's owner, is passed only to
# the shell steps that need it: push the branch, open the PR, resume a PR.
# AUTOPILOT_BOARD_TOKEN, a classic token with the `project` and `repo` scopes, moves
# the board card: the repository belongs to a user, and neither a GitHub App token
# nor a fine-grained token can reach a user's project. A branch or PR made with
# GITHUB_TOKEN would start no workflows (the reviewers and the build check would
# never run). Claude's commits travel from the build job to the publish job as a git
# bundle, so the job that holds the push token never runs anything Claude wrote.
# workflows.test.sh checks that no job that runs Claude references either token.
#
# Claude authenticates with CLAUDE_CODE_OAUTH_TOKEN (the subscription), unless the
# secret AUTOPILOT_ANTHROPIC_API_KEY is set: then build and analysis use that API
# key instead, which a Console workspace spend limit can cap hard.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: The waiting issue to start again (the queue does this)
        required: true
        type: string

permissions: {}

# One attempt per issue at a time; a second label event waits for the first run.
# Runs for other labels get their own group, so they can't displace a waiting one.
concurrency:
  group: autopilot-${{ github.event.issue.number || inputs.issue }}-${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'autopilot') && 'attempt' || github.run_id }}
  cancel-in-progress: false

jobs:
  start:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'autopilot'
    runs-on: [self-hosted, strato]
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      SENDER: ${{ github.event.sender.login || github.actor }}
      TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'queue' || 'label' }}
      PIPELINE_MODE: ${{ vars.PIPELINE_MODE }}
      AUTOPILOT_USERS: ${{ vars.AUTOPILOT_USERS }}
      AUTOPILOT_CLAUDE_AUTH: ${{ secrets.AUTOPILOT_ANTHROPIC_API_KEY != '' && 'api-key' || 'subscription' }}
    outputs:
      go: ${{ steps.start.outputs.go }}
      route: ${{ steps.start.outputs.route }}
      mode: ${{ steps.start.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: precheck
        env:
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          AUTOPILOT_PROJECT_ID: ${{ vars.AUTOPILOT_PROJECT_ID }}
          AUTOPILOT_BOARD_TOKEN: ${{ secrets.AUTOPILOT_BOARD_TOKEN }}
          AUTOPILOT_DIR: ${{ runner.temp }}/autopilot
        run: bash .github/scripts/autopilot.sh precheck

      # The runner's system Node is too old for Claude Code.
      - uses: actions/setup-node@v4
        if: steps.precheck.outputs.ok == 'true' && env.AUTOPILOT_CLAUDE_AUTH == 'subscription'
        with:
          node-version: '22'

      # One minimal Claude Code call, only to read the subscription's usage status
      # from its rate_limit_event. Its output never contains the token.
      - name: Probe Claude's usage status
        if: steps.precheck.outputs.ok == 'true' && env.AUTOPILOT_CLAUDE_AUTH == 'subscription'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No GitHub token for Claude, and no tools: it can only answer.
          GH_TOKEN: ""
        run: |
          mkdir -p ${{ runner.temp }}/autopilot
          npm install --global --silent @anthropic-ai/claude-code@2.1.68 >/dev/null 2>&1 || true
          claude -p "Reply with OK." --model haiku --max-turns 1 --tools "" --strict-mcp-config --no-session-persistence --output-format stream-json --verbose \
            >"$RUNNER_TEMP/probe.jsonl" 2>/dev/null || true
          bash .github/scripts/claude-usage.sh "$RUNNER_TEMP/probe.jsonl" >${{ runner.temp }}/autopilot/claude-status.json \
            || rm -f ${{ runner.temp }}/autopilot/claude-status.json
          cat ${{ runner.temp }}/autopilot/claude-status.json 2>/dev/null || echo "The probe reported no usage status."

      - id: start
        if: steps.precheck.outputs.ok == 'true'
        env:
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          AUTOPILOT_PROJECT_ID: ${{ vars.AUTOPILOT_PROJECT_ID }}
          AUTOPILOT_BOARD_TOKEN: ${{ secrets.AUTOPILOT_BOARD_TOKEN }}
          CLAUDE_STATUS_FILE: ${{ runner.temp }}/autopilot/claude-status.json
          AUTOPILOT_DIR: ${{ runner.temp }}/autopilot
        run: bash .github/scripts/autopilot.sh start

  # --- the build route: one Claude run that judges, builds and tests ----------------
  build:
    needs: start
    if: needs.start.outputs.go == 'true' && needs.start.outputs.route == 'build'
    runs-on: [self-hosted, strato]
    timeout-minutes: 100
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 50

      - name: Check out the musichub understanding (read-only)
        uses: actions/checkout@v4
        with:
          repository: vanBassum/musichub-understanding
          ref: main
          path: understanding
          ssh-key: ${{ secrets.UNDERSTANDING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0

      # Everything the run reads, from trusted sources. The sandbox gets no GitHub
      # token, so the issue (with its comments), the open PRs and the issue's images
      # are fetched here. The prompts and scripts it follows come from main, into a
      # directory it can't change.
      - name: Prepare the sandbox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/sandbox.sh prepare "$RUNNER_TEMP/sandbox" "$GITHUB_WORKSPACE"
          cp .github/scripts/sandbox-job.sh .github/scripts/claude-usage.sh .github/scripts/shadcn-components.sh \
             .github/scripts/add-package.sh .github/autopilot/build.md .github/autopilot/admission.md "$RUNNER_TEMP/sandbox/trusted/"
          cp .github/reviewers/understanding.md "$RUNNER_TEMP/sandbox/trusted/reviewer-understanding.md"
          bash .github/scripts/thread-markdown.sh issue "${{ github.repository }}" "$ISSUE" >"$RUNNER_TEMP/sandbox/in/issue.md"
          gh pr list --repo "${{ github.repository }}" --state open --limit 100 >"$RUNNER_TEMP/sandbox/in/open-prs.md"
          bash .github/scripts/understanding-pending-logs.sh understanding understanding-pending-logs.md
          mv understanding-pending-logs.md "$RUNNER_TEMP/sandbox/in/"
          cp -r understanding "$RUNNER_TEMP/sandbox/in/understanding" && rm -rf "$RUNNER_TEMP/sandbox/in/understanding/.git"
          bash .github/scripts/issue-images.sh "${{ github.repository }}" "$ISSUE" "$RUNNER_TEMP/sandbox/in/images"

      - name: Claude judges and builds the issue, in the sandbox
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.AUTOPILOT_ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.AUTOPILOT_ANTHROPIC_API_KEY }}
          SANDBOX_REPO: ${{ github.repository }}
          SANDBOX_ISSUE: ${{ github.event.issue.number || inputs.issue }}
          SANDBOX_JUDGE_ONLY: ${{ needs.start.outputs.mode != 'full' }}
        run: bash .github/scripts/sandbox.sh run "$RUNNER_TEMP/sandbox" 90 bash /work/trusted/sandbox-job.sh build

      # Only regular files, read as data: a link the run left could point anywhere
      # on the runner.
      - name: Keep the results
        if: always()
        run: |
          mkdir -p ${{ runner.temp }}/autopilot
          for f in result.md base validation autopilot.bundle usage-build.json claude-exit; do
            if [ -f "$RUNNER_TEMP/sandbox/out/$f" ] && [ ! -L "$RUNNER_TEMP/sandbox/out/$f" ]; then cp "$RUNNER_TEMP/sandbox/out/$f" ${{ runner.temp }}/autopilot/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopilot-build
          path: ${{ runner.temp }}/autopilot/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the sandbox
        if: always()
        run: bash .github/scripts/sandbox.sh clean "$RUNNER_TEMP/sandbox"

  publish:
    needs: [start, build]
    if: always() && needs.start.outputs.go == 'true' && needs.start.outputs.route == 'build'
    runs-on: [self-hosted, strato]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: autopilot-build
          path: ${{ runner.temp }}/autopilot
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          AUTOPILOT_PROJECT_ID: ${{ vars.AUTOPILOT_PROJECT_ID }}
          AUTOPILOT_BOARD_TOKEN: ${{ secrets.AUTOPILOT_BOARD_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          PIPELINE_MODE: ${{ vars.PIPELINE_MODE }}
          START_MODE: ${{ needs.start.outputs.mode }}
          BUILD_RESULT: ${{ needs.build.result }}
          AUTOPILOT_DIR: ${{ runner.temp }}/autopilot
        run: bash .github/scripts/autopilot.sh publish

  # --- the investigation route ------------------------------------------------------
  analysis:
    needs: start
    if: needs.start.outputs.go == 'true' && needs.start.outputs.route == 'investigation'
    runs-on: [self-hosted, strato]
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 50

      - name: Check out the musichub understanding (read-only)
        uses: actions/checkout@v4
        with:
          repository: vanBassum/musichub-understanding
          ref: main
          path: understanding
          ssh-key: ${{ secrets.UNDERSTANDING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0

      - name: Assemble unprojected accepted logs
        run: bash .github/scripts/understanding-pending-logs.sh understanding understanding-pending-logs.md

      # The images attached to the issue, for Claude's Read tool: Claude itself gets
      # no network access. Not uploaded as an artifact. See issue-images.sh.
      - name: Download the issue's images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/issue-images.sh "${{ github.repository }}" "${{ github.event.issue.number || inputs.issue }}" "${{ runner.temp }}/autopilot/images"

      # The report is Claude's FINAL MESSAGE, read from the action's execution log, so
      # this step needs no write access at all. It reads, and runs nothing it reads.
      - name: Claude investigation
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.AUTOPILOT_ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.AUTOPILOT_ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The queue starts a waiting investigation through workflow_dispatch with
          # GITHUB_TOKEN, so the actor is github-actions[bot]. It is no wider than a
          # person with write access, and `start` lets nothing through for an issue
          # that a person with write access didn't label (see autopilot.sh, admit).
          allowed_bots: github-actions
          # Never buffer inline comments. The action's buffer is one fixed file,
          # /tmp/inline-comments-buffer.jsonl, that it never empties; on the shared
          # self-hosted runner every later job (also a concurrent one) would post
          # what is in it to its own PR, or fail on an issue that has none.
          # See .github/scripts/workflows.test.sh.
          classify_inline_comments: "false"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: ${{ github.event.issue.number || inputs.issue }}
            IMAGES_DIR: ${{ runner.temp }}/autopilot/images
            PENDING ACCEPTED LOGS: understanding-pending-logs.md

            Read .github/autopilot/investigation.md and follow it exactly. The current
            musichub understanding is checked out read-only at understanding/.
          claude_args: |
            --max-turns 100
            --add-dir understanding
            --add-dir ${{ runner.temp }}/autopilot/images
            --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*)"

      - name: Keep the report and its usage
        if: always()
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          mkdir -p ${{ runner.temp }}/autopilot
          if [ -f "$EXEC" ]; then
            jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$EXEC" \
              | sed -n -E '/^## Autopilot investigation/,$p' >${{ runner.temp }}/autopilot/analysis.md
            bash .github/scripts/claude-usage.sh "$EXEC" >${{ runner.temp }}/autopilot/usage-analysis.json || rm -f ${{ runner.temp }}/autopilot/usage-analysis.json
          fi
          touch ${{ runner.temp }}/autopilot/analysis.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopilot-analysis
          path: |
            ${{ runner.temp }}/autopilot/analysis.md
            ${{ runner.temp }}/autopilot/usage-analysis.json
          if-no-files-found: ignore
          retention-days: 14

  decide:
    needs: [start, analysis]
    if: always() && needs.start.outputs.go == 'true' && needs.start.outputs.route == 'investigation'
    runs-on: [self-hosted, strato]
    timeout-minutes: 5
    # issues: write only to comment on this issue and change its labels. GitHub has
    # no narrower permission, so the script holds the line: it has no command that
    # creates an issue, and an investigation closes none (autopilot.test.sh checks
    # both); it holds no AUTOPILOT_PAT, only AUTOPILOT_BOARD_TOKEN for the card.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: autopilot-analysis
          path: ${{ runner.temp }}/autopilot
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPILOT_PROJECT_ID: ${{ vars.AUTOPILOT_PROJECT_ID }}
          AUTOPILOT_BOARD_TOKEN: ${{ secrets.AUTOPILOT_BOARD_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          INVESTIGATION: 'true'
          PIPELINE_MODE: ${{ vars.PIPELINE_MODE }}
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          AUTOPILOT_DIR: ${{ runner.temp }}/autopilot
        run: bash .github/scripts/autopilot.sh decide
