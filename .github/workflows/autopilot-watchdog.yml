name: Autopilot watchdog

# A job that fails is a crash, a timeout, a runner that went away or a reviewer that
# left no verdict: never something Claude decided, which ends in a comment instead.
# When a run of Autopilot, Autopilot fix or Claude PR review fails, this reruns its
# failed jobs once. When the rerun fails too, the attempt that waits for that run
# stops, with the jobs that failed, so nothing hangs silently in a stage (see
# .github/scripts/autopilot.sh, cmd_watchdog). A review run in which only the merge
# gate refused is no failure here: the review's autopilot job handles that. A
# person's PR gets its failed reviewer rerun once too, without comments.
#
# workflow_run runs this from main, whatever branch the watched run was for, and
# only for runs that GitHub reports as completed. The rerun is started with
# AUTOPILOT_PAT when it can be, so that its own failure starts this workflow again;
# it falls back to GITHUB_TOKEN. The job runs no Claude and no code of any PR: only
# autopilot.sh from main.

on:
  workflow_run:
    workflows: [Autopilot, Autopilot fix, Claude PR review]
    types: [completed]

permissions: {}

concurrency:
  group: autopilot-watchdog-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  watch:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: [self-hosted, strato]
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      # To read the failed run's jobs and rerun them.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          AUTOPILOT_PROJECT_ID: ${{ vars.AUTOPILOT_PROJECT_ID }}
          AUTOPILOT_BOARD_TOKEN: ${{ secrets.AUTOPILOT_BOARD_TOKEN }}
          AUTOPILOT_DIR: ${{ runner.temp }}/autopilot
          WATCHED_RUN: ${{ github.event.workflow_run.id }}
          WATCHED_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WATCHED_WORKFLOW: ${{ github.event.workflow_run.name }}
          WATCHED_TITLE: ${{ github.event.workflow_run.display_title }}
        run: bash .github/scripts/autopilot.sh watchdog
