name: Claude

# Claude works on an issue or a PR, with the official anthropics/claude-code-action:
#
# - the `autopilot` label on an issue: Claude builds it on a `claude/…` branch and
#   opens the PR, or stops and says in its comment which decision is missing;
# - `@claude` in a comment on an issue or a PR: Claude does what the comment asks.
#   On a PR it pushes to the PR's branch ("@claude fix the review findings").
#
# Claude follows .github/autopilot.md. Its PR gets the usual build check and the
# four reviewers; Bas merges. The action authenticates as the Claude GitHub App
# (https://github.com/apps/claude, through this job's OIDC token): a push with the
# App's token starts the build and the reviewers, one with GITHUB_TOKEN wouldn't.
# Only people with write access can start it; bots can't.
#
# It runs on the self-hosted runner, with the product's toolchain, so Claude can
# restore, build, test and generate migrations itself.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'autopilot') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
       github.event.comment.user.type != 'Bot')
    runs-on: [self-hosted, strato]
    timeout-minutes: 90
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # The Claude GitHub App's token.
      id-token: write
      # The build check's results on a PR (additional_permissions below).
      actions: read
    steps:
      # Full history: on a PR the action then fetches the branch without a depth
      # limit, so `git fetch origin main` and `git merge origin/main` find the
      # merge base and Claude can resolve a conflict with main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the musichub understanding (read-only)
        uses: actions/checkout@v4
        with:
          repository: vanBassum/musichub-understanding
          ref: main
          path: understanding
          ssh-key: ${{ secrets.UNDERSTANDING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0

      # Writes understanding-pending-logs.md next to it. Neither is ever committed.
      - name: Assemble unprojected accepted logs
        run: |
          bash .github/scripts/understanding-pending-logs.sh understanding understanding-pending-logs.md
          printf '/understanding/\n/understanding-pending-logs.md\n' >> .git/info/exclude

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      - name: Install dotnet-ef
        run: |
          dotnet tool install dotnet-ef --version 10.0.0 --tool-path "$RUNNER_TEMP/dotnet-tools"
          echo "$RUNNER_TEMP/dotnet-tools" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: autopilot
          # The action's inline-comment buffer is one fixed file on the shared
          # runner (see .github/scripts/workflows.test.sh).
          classify_inline_comments: "false"
          additional_permissions: |
            actions: read
          # The repository is public: Claude reads only the comments of Bas, of
          # itself and of the reviewers, so nobody else can steer it.
          include_comments_by_actor: "vanBassum,claude[bot],github-actions[bot]"
          # One entry per command Claude needs, as the action's docs advise. git add,
          # commit, rm and push come from the action itself: it pushes through its
          # own wrapper, which allows no flags, so no git push or fetch here.
          # Only a run started by the autopilot label may turn on auto-merge, for the
          # PR it opens itself; a run on someone else's PR never can.
          claude_args: |
            --max-turns 150
            --add-dir understanding
            --allowedTools "Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git mv:*),Bash(git fetch origin main),Bash(git merge origin/main:*),Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet add:*),Bash(dotnet ef migrations add:*),Bash(pnpm --dir musichub-ui install:*),Bash(pnpm --dir musichub-ui lint:*),Bash(pnpm --dir musichub-ui typecheck:*),Bash(pnpm --dir musichub-ui build:*),Bash(pnpm --dir musichub-ui format:*),Bash(pnpm --dir musichub-ui add:*),Bash(pnpm --dir musichub-ui exec shadcn add:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)${{ github.event_name == 'issues' && ',Bash(gh pr merge --auto --squash:*)' || '' }}"
            --append-system-prompt "Before anything else, read .github/autopilot.md and follow it."
